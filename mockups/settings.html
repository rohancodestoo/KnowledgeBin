<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - KnowledgeBin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar glass">
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            KnowledgeBin
        </div>
        <div class="nav-actions">
            <a href="dashboard.html" style="color: var(--text-secondary);">My Notes</a>
            <a href="settings.html" style="color: var(--text-primary); font-weight: 500;">Settings</a>
            <button id="theme-switch" class="theme-switch" aria-label="Toggle Theme">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
            <a href="login.html" class="btn btn-outline">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container animate-fade-in">
        <div class="dashboard-header">
            <div>
                <h1>Settings</h1>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">Manage your account and preferences.</p>
            </div>
        </div>

        <div style="max-width: 600px;">
            <div class="note-card" style="margin-bottom: 2rem;">
                <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem;">Account Details</h2>
                
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" value="john_doe">
                </div>
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="john@example.com">
                </div>
                
                <button class="btn btn-primary" style="margin-top: 1rem;">Save Changes</button>
            </div>

            <div class="note-card">
                <h2 style="margin-bottom: 1.5rem; font-size: 1.25rem; color: var(--danger-color);">Danger Zone</h2>
                <p style="color: var(--text-secondary); margin-bottom: 1rem;">Once you delete your account, there is no going back. Please be certain.</p>
                <button class="btn btn-outline" style="color: var(--danger-color); border-color: var(--danger-color);">Delete Account</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
