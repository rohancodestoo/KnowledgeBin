<style>
    /* Editor Styles to match TipTap */
    .ProseMirror {
        outline: none;
        min-height: 300px;
        font-family: 'Inter', sans-serif;
    }

    .ProseMirror p.is-editor-empty:first-child::before {
        color: #adb5bd;
        content: attr(data-placeholder);
        float: left;
        height: 0;
        pointer-events: none;
    }

    /* Task Lists */
    ul[data-type="taskList"] {
        list-style: none;
        padding: 0;
    }

    li[data-type="taskItem"] {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        margin-bottom: 0.5rem;
    }

    li[data-type="taskItem"] label {
        margin-right: 0.5rem;
        user-select: none;
        margin-top: 0.2rem;
    }

    li[data-type="taskItem"] div {
        flex: 1;
    }

    /* Menu Button Styles */
    .menu-btn {
        padding: 0.5rem;
        border-radius: 0.375rem;
        color: var(--text-secondary);
        transition: all 0.2s;
    }

    .menu-btn:hover {
        background-color: var(--bg-secondary);
        color: var(--text-primary);
    }

    .menu-btn.is-active {
        background-color: var(--border-color);
        color: var(--text-primary);
    }

    /* Blockquote Styling */
    .ProseMirror blockquote {
        border-left: 4px solid var(--border-color);
        padding-left: 1rem;
        margin-left: 0;
        margin-right: 0;
        font-style: italic;
        color: var(--text-secondary);
        background: var(--bg-secondary);
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;

</style>

<script type="module">
    import { Editor, Mark, mergeAttributes } from 'https://esm.sh/@tiptap/core';
    import StarterKit from 'https://esm.sh/@tiptap/starter-kit';
    import Placeholder from 'https://esm.sh/@tiptap/extension-placeholder';
    import TaskList from 'https://esm.sh/@tiptap/extension-task-list';
    import TaskItem from 'https://esm.sh/@tiptap/extension-task-item';
    import Underline from 'https://esm.sh/@tiptap/extension-underline';
    import Highlight from 'https://esm.sh/@tiptap/extension-highlight';

    // Define Ghost Text Mark
    const GhostMark = Mark.create({
        name: 'ghost',
        renderHTML({ HTMLAttributes }) {
            return ['span', mergeAttributes(HTMLAttributes, { class: 'text-muted opacity-50' }), 0]
        },
        parseHTML() {
            return [{ tag: 'span.text-muted.opacity-50' }]
        }
    });

    let editor;
    const saveStatus = document.getElementById('saveStatus');
    const aiDropdownBtn = document.getElementById('aiDropdownBtn');
    const aiDropdownMenu = document.getElementById('aiDropdownMenu');
    const aiToggle = document.getElementById('aiToggle');
    let saveTimeout;
    let aiTimeout;
    let isAiGenerating = false;
    let ghostRange = null; // Track ghost text position {from, to}

    // ... (AI Functions omitted for brevity, keeping existing) ...

    // --- AI Completion Function ---
    async function triggerAiCompletion(editor, silent = false) {
        if (isAiGenerating) return;

        const text = editor.getText();
        const words = text.split(/\s+/).slice(-100).join(" ");

        if (words.length < 5) return;

        isAiGenerating = true;
        if (!silent) {
            saveStatus.innerText = "AI writing...";
            saveStatus.classList.add("text-accent", "animate-pulse");
        }

        try {
            const res = await fetch("{% url 'ai_completion' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ prompt: words })
            });

            const data = await res.json();
            if (data.completion) {
                // Determine completion text
                const currentText = editor.getText();
                let completion = data.completion;
                if (!currentText.endsWith(' ') && !completion.startsWith(' ')) {
                    completion = ' ' + completion;
                }

                // Insert as ghost text
                const startPos = editor.state.selection.from;

                // We use command to insert content with mark, but we need to ensure it doesn't replace selection if any?
                // Assuming cursor at end or normal typing position.

                editor.chain()
                    .insertContent({
                        type: 'text',
                        text: completion,
                        marks: [{ type: 'ghost' }]
                    })
                    .setTextSelection(startPos) // Move cursor back to start of ghost text
                    .run();

                // Calculate where the ghost text is
                ghostRange = {
                    from: startPos,
                    to: startPos + completion.length
                };

                // No typeWriter anymore

            }
        } catch (e) {
            console.error("AI Error:", e);
        } finally {
            isAiGenerating = false;
            saveStatus.innerText = "Saved";
            saveStatus.classList.remove("text-accent", "animate-pulse");
        }
    }


    // --- AI Summarization ---
    window.triggerAiSummarize = async function () {
        const text = editor.getText();
        if (text.length < 20) {
            alert("Please write more content first.");
            return;
        }

        saveStatus.innerText = "Summarizing...";
        saveStatus.classList.add("text-purple-600", "animate-pulse");

        try {
            const res = await fetch("{% url 'ai_summarize' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ content: text })
            });
            const data = await res.json();
            if (data.summary && !data.summary.startsWith("Error")) {
                editor.commands.focus('start');
                editor.commands.insertContent(`<div class="bg-purple-50 p-4 rounded-lg my-4 border-l-4 border-purple-500"><strong>✨ AI Summary:</strong> ${data.summary}</div><p></p>`);
            } else if (data.summary && data.summary.startsWith("Error")) {
                alert("Summary failed: " + data.summary);
            } else {
                alert("Summary failed.");
            }
        } catch (e) {
            console.error(e);
            alert("Summary failed to executing request.");
        }
        finally {
            saveStatus.innerText = "Saved";
            saveStatus.classList.remove("text-purple-600", "animate-pulse");
            toggleAiDropdown();
        }
    }

    // --- AI Tags ---
    window.triggerAiTags = async function () {
        const text = editor.getText();
        if (text.length < 20) {
            alert("Please write more content first.");
            return;
        }
        saveStatus.innerText = "Finding Tags...";
        saveStatus.classList.add("text-purple-600", "animate-pulse");

        try {
            const res = await fetch("{% url 'ai_auto_tag' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ content: text, note_id: "{{ note.id }}" })
            });
            const data = await res.json();
            if (data.tags && data.tags.length > 0) {
                for (let tag of data.tags) {
                    await addTag(tag);
                }
            }
        } catch (e) { console.error(e); }
        finally {
            saveStatus.innerText = "Saved";
            saveStatus.classList.remove("text-purple-600", "animate-pulse");
            toggleAiDropdown();
        }
    }

    // --- Tag Logic ---
    async function addTag(tagName) {
        try {
            const res = await fetch("{% url 'add_tag' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ note_id: "{{ note.id }}", tag_name: tagName })
            });
            const data = await res.json();
            if (data.success) {
                renderTag(data.tag);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function renderTag(tag) {
        const container = document.getElementById('tags-container');
        if (!container || document.querySelector(`[data-tag-id="${tag.id}"]`)) return;

        const el = document.createElement('span');
        el.className = "inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-background text-foreground border border-border mr-2 mb-2";
        el.dataset.tagId = tag.id;

        const label = document.createElement('span');
        label.textContent = `#${tag.name}`;
        el.appendChild(label);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = "ml-1 text-gray-400 hover:text-red-500 font-bold focus:outline-none";
        btn.innerHTML = "&times;";
        btn.title = `Remove tag #${tag.name}`;
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            removeTag(tag.id, tag.name);
        });
        el.appendChild(btn);

        container.appendChild(el);
    }

    window.removeTag = async function (tagId, tagName) {
        if (!confirm(`Remove tag #${tagName}?`)) return;
        try {
            const res = await fetch("{% url 'remove_tag' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ note_id: "{{ note.id }}", tag_id: tagId, tag_name: tagName })
            });
            if (res.ok) {
                const el = document.querySelector(`[data-tag-id="${tagId}"]`);
                if (el) el.remove();
            }
        } catch (e) { console.error(e); }
    }

    // --- Dropdown Logic ---
    window.toggleAiDropdown = function () {
        aiDropdownMenu.classList.toggle('hidden');
    }

    window.toggleThemeDropdown = function () {
        document.getElementById('themeDropdown').classList.toggle('hidden');
    }

    // Event listener for dropdowns moved to end of script for unified handling


    // --- Save Function ---
    async function saveContent(htmlContent) {
        // ... (keeping existing save logic)
        const spinner = document.getElementById('saveSpinner');
        saveStatus.innerText = "Saving...";
        saveStatus.classList.add("text-stone-500");
        spinner.classList.remove('hidden');

        try {
            const res = await fetch("{% url 'save_note' note.id %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ content: htmlContent })
            });
            if (res.ok) {
                setTimeout(() => {
                    saveStatus.innerText = "Saved";
                    saveStatus.classList.remove("text-stone-500");
                    spinner.classList.add('hidden');
                }, 500);
            } else {
                saveStatus.innerText = "Error";
                spinner.classList.add('hidden');
            }
        } catch (e) {
            console.error("Save error:", e);
            saveStatus.innerText = "Error";
            spinner.classList.add('hidden');
        }
    }

    // --- Initialize Editor with Tasks ---
    document.addEventListener('DOMContentLoaded', () => {
        const initialContent = JSON.parse(document.getElementById('note-content-data').textContent) || '';

        editor = new Editor({
            element: document.querySelector('#tiptap-editor'),
            extensions: [
                StarterKit,
                Placeholder.configure({
                    placeholder: "Write something amazing...",
                }),
                TaskList,
                TaskItem.configure({
                    nested: true,
                }),
                Underline,
                Highlight.configure({ multicolor: true }),
                GhostMark,
            ],
            content: initialContent,
            onUpdate: ({ editor, transaction }) => {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    const html = editor.getHTML();
                    // Don't save if it contains ghost text to avoid saving suggestions? 
                    // Actually, if we use a Mark, it *will* be saved in HTML. 
                    // This is a trade-off. We might want to strip it before save or accept that draft notes might have suggestions.
                    // For now, let's just save it.
                    saveContent(html);
                }, 800);
                updateMenuBar(editor);

                // Auto AI Logic
                if (aiToggle && aiToggle.checked && !isAiGenerating && !ghostRange) {
                    // Check if ghost text already exists?
                    // Only trigger if no ghost text currently
                    clearTimeout(aiTimeout);
                    aiTimeout = setTimeout(() => {
                        // Ensure we are not typing
                        triggerAiCompletion(editor, true);
                    }, 2000); // 2 seconds debounce
                }
            },
            editorProps: {
                handleKeyDown: (view, event) => {
                    const { state, dispatch } = view;

                    // Tab to Accept
                    if (event.key === 'Tab' && ghostRange) {
                        event.preventDefault();
                        // Remove ghost mark from range
                        const tr = state.tr.removeMark(ghostRange.from, ghostRange.to, state.schema.marks.ghost);
                        // Move cursor to end
                        tr.setSelection(state.selection.constructor.near(tr.doc.resolve(ghostRange.to)));
                        dispatch(tr);
                        ghostRange = null; // Clear
                        return true;
                    }

                    // Any other key (except some modifiers?) -> Dismiss ghost text
                    if (ghostRange && !['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(event.key)) {
                        // If we are typing, we delete the ghost text first
                        // But wait, if we delete, we consume the event?
                        // No, we want to delete ghost text AND let the keypress happen.

                        // Delete ghost range
                        const tr = state.tr.delete(ghostRange.from, ghostRange.to);
                        dispatch(tr);
                        ghostRange = null;

                        // Return false so the key press is handled normally (typing the new char)
                        return false;
                    }

                    return false;
                }
            }
        });

        // Initialize Menu Bar
        initMenuBar(editor);

        const deleteBtn = document.getElementById('deleteNoteBtn');
        if (deleteBtn) {
            deleteBtn.addEventListener('click', window.deleteNote);
        }

        // Load existing tags
        try {
            const tagsData = JSON.parse(document.getElementById('note-tags-data').textContent);
            if (Array.isArray(tagsData)) {
                tagsData.forEach(tag => renderTag(tag));
            }
        } catch (e) {
            console.error("Error loading tags:", e);
        }
    });

    // --- Menu Bar Logic ---
    function initMenuBar(editor) {
        const buttons = document.querySelectorAll('.menu-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const command = btn.dataset.command;
                const level = btn.dataset.level ? parseInt(btn.dataset.level) : null;

                if (command === 'toggleHeading') {
                    editor.chain().focus().toggleHeading({ level: level }).run();
                } else if (!command) {
                    return;
                } else {
                    if (editor.chain().focus()[command]) {
                        editor.chain().focus()[command]().run();
                    }
                }
            });
        });
    }

    function updateMenuBar(editor) {
        // ... (keep existing)
        const buttons = document.querySelectorAll('.menu-btn');

        buttons.forEach(btn => {
            const command = btn.dataset.command;
            if (!command) return;

            const level = btn.dataset.level ? parseInt(btn.dataset.level) : null;
            let isActive = false;

            if (command === 'toggleHeading') {
                isActive = editor.isActive('heading', { level: level });
            } else if (command === 'undo' || command === 'redo') {
                btn.disabled = !editor.can()[command]();
                btn.style.opacity = btn.disabled ? '0.5' : '1';
                return;
            } else {
                const checkName = command.replace('toggle', '').toLowerCase();
                const finalName = checkName === 'bulletlist' ? 'bulletList' :
                    checkName === 'orderedlist' ? 'orderedList' :
                        checkName === 'blockquote' ? 'blockquote' :
                            checkName === 'underline' ? 'underline' :
                                checkName === 'highlight' ? 'highlight' : checkName;
                isActive = editor.isActive(finalName);
            }

            if (isActive) {
                btn.classList.add('is-active');
            } else {
                btn.classList.remove('is-active');
            }
        });
    }

    // --- Delete Logic ---
    window.deleteNote = async function () {
        if (!confirm('Are you sure you want to delete this note?')) return;
        try {
            await fetch("{% url 'delete_note' note.id %}", {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            });
            window.location.href = "{% url 'dashboard' %}";
        } catch (e) {
            console.error(e);
            alert('Failed to delete note');
        }
    }

    // --- Export Logic ---
    window.toggleExportDropdown = function () {
        document.getElementById('exportDropdown').classList.toggle('hidden');
    }

    window.exportTXT = function () {
        const text = editor.getText();
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "{{ note.title|slugify|default:'note' }}.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    window.exportPDF = function () {
        const element = document.getElementById('tiptap-editor');
        const opt = {
            margin: 1,
            filename: "{{ note.title|slugify|default:'note' }}.pdf",
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // Close export dropdown on click outside
    document.addEventListener('click', function (event) {
        if (aiDropdownBtn && !aiDropdownBtn.contains(event.target) && aiDropdownMenu && !aiDropdownMenu.contains(event.target)) {
            aiDropdownMenu.classList.add('hidden');
        }

        const themeBtn = document.querySelector('button[onclick="toggleThemeDropdown()"]');
        const themeMenu = document.getElementById('themeDropdown');
        if (themeBtn && themeMenu && !themeBtn.contains(event.target) && !themeMenu.contains(event.target)) {
            themeMenu.classList.add('hidden');
        }

        const exportBtn = document.querySelector('button[onclick="toggleExportDropdown()"]');
        const exportMenu = document.getElementById('exportDropdown');
        if (exportBtn && exportMenu && !exportBtn.contains(event.target) && !exportMenu.contains(event.target)) {
            exportMenu.classList.add('hidden');
        }
    });
</script>
